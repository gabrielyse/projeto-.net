services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: primeiraapi
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d primeiraapi"]
      interval: 5s
      timeout: 5s
      retries: 10

  primeiraapi:
    image: primeiraapi
    build:
      context: .
      dockerfile: PrimeiraApi/Dockerfile
    environment:
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=primeiraapi;Username=postgres;Password=${POSTGRES_PASSWORD:-postgres}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
